ServerName localhost

<VirtualHost *:${PORT}>
	# Moodle 5.1+ serves only public/; config.php, the CLI and the data stay outside it.
	DocumentRoot /var/www/moodle/public
	<Directory /var/www/moodle/public>
		Options FollowSymLinks
		AllowOverride None
		Require all granted
		DirectoryIndex index.php
		# Moodle's router: paths that are not files go to r.php.
		FallbackResource /r.php
	</Directory>

	# Internal files Moodle's security guide says to hide.
	<LocationMatch "/vendor/|/node_modules/|/\.(?!well-known/)|composer\.json|\.lock$|/environment\.xml|/install\.xml|/(README|readme|moodle_readme)|/upgrade\.txt|phpunit\.xml\.dist|/tests/behat/|/fixtures/">
		Require all denied
	</LocationMatch>

	# Railway's deploy health check: a static file, so it answers the same while
	# Moodle installs or upgrades.
	Alias /healthz /usr/local/share/railway/healthz
	<Directory /usr/local/share/railway>
		Require all granted
	</Directory>

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
